name: PR Checks

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pre-checks:
    name: Ensure PR has a valid label
    runs-on: ubuntu-latest

    steps:
      - name: Ensure PR has a valid label
        run: |
          labels=$(jq -r '.pull_request.labels[].name' <<< "${{ toJson(github.event) }}")
          echo "Labels on PR: $labels"

          if [[ "$labels" != *"enhancement"* || "$labels" != *"bug"* || "$labels" != *"documentation"* ]]; then
            echo "❌ PR must have one of the following labels: enhancement, bug, documentation"
            exit 1
          fi
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint_run
        run: |
          npx eslint . -f json -o eslint-report.json || true

      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json

  lint-analysis:
    name: ESLint Analysis
    runs-on: ubuntu-latest
    needs: lint
    if: always() # always run even if lint failed

    steps:
      - uses: actions/checkout@v4

      - name: Download ESLint Report
        uses: actions/download-artifact@v4
        with:
          name: eslint-report
          path: ./

      - name: Annotate ESLint Results
        uses: ataylorme/eslint-annotate-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          report-json: eslint-report.json
          only-pr-files: true
          fail-on-warning: false
          check-name: ESLint Analysis Results

      - name: Summarize ESLint Results
        id: eslint_summary
        run: |
          ERRORS=$(jq '[.[] | .messages[] | select(.severity == 2)] | length' eslint-report.json)
          WARNINGS=$(jq '[.[] | .messages[] | select(.severity == 1)] | length' eslint-report.json)
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

      - name: Post ESLint Summary Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: false
          message: |
            ### 🧹 ESLint Report
            **Status:** ${{ steps.eslint_summary.outputs.errors == '0' && '✅ Passed' || '❌ Failed' }}
            **Errors:** ${{ steps.eslint_summary.outputs.errors }}
            **Warnings:** ${{ steps.eslint_summary.outputs.warnings }}
            **Details:** See inline annotations in the PR diff.
            **Workflow:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=lcov

      - name: Publish Jest Coverage
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          package-manager: npm
          test-script: npm test -- --coverage
