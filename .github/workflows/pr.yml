on:
  pull_request_target:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ensures we have diff context for PR annotations

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # 🧩 Run ESLint, but continue on failure so annotations can still post
      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: |
          npx eslint . -f json -o eslint-report.json --max-warnings=0 || echo "ESLint completed with errors"

      # 🧩 Annotate ESLint Results on PR diff view
      - name: Annotate ESLint Results
        if: always()
        uses: ataylorme/eslint-annotate-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          report-json: eslint-report.json
          only-pr-files: true
          fail-on-warning: true

      # 🧩 Fail the job if ESLint found errors
      - name: Fail if ESLint Errors Found
        if: steps.eslint.outcome != 'success'
        run: |
          echo "❌ ESLint errors found. Check annotations in the PR diff."
          exit 1

      # 🧩 Optional summary comment for PR
      - name: Post ESLint Summary Comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ### 🧹 ESLint Report
            - **Status:** ${{ steps.eslint.outcome }}
            - **Errors/Warnings:** See inline annotations in PR diff.
            - **Workflow:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=lcov

      - name: Publish Jest Coverage
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          package-manager: npm
          test-script: npm test -- --coverage
