name: PR Checks

on:
 pull_request:
  branches: [develop]
 push:
  branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
 lint-and-test:
  runs-on: ubuntu-latest
  permissions:
   contents: read
   pull-requests: write

  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 20
   - run: npm ci

   # --- ESLint Step ---
   - name: Run ESLint
     id: eslint
     continue-on-error: true
     run: |
      npx eslint . --ext .js,.ts -f json -o eslint-report.json || true

   - name: Annotate ESLint results
     if: always()
     uses: ataylorme/eslint-annotate-action@v3
     with:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      report-json: eslint-report.json

   # --- Tests + Coverage ---
   - name: Run Tests with Coverage
     id: tests
     run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=lcov
#
   - name: Comment Coverage Summary
     if: always()
     uses: MishaKav/jest-coverage-comment@v1
     with:
      coverage-path: ./coverage/coverage-summary.json
      github-token: ${{ secrets.GITHUB_TOKEN }}
      title: 🧪 Jest Coverage Report
