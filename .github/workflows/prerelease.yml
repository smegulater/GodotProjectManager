name: Prerelease (develop)

on:
  push:
    branches: [develop]

jobs:
  prerelease:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: read
      pull-requests: read

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # ----------------------------------------------------------
      # Determine change type (major/minor/patch) from linked PR labels
      # ----------------------------------------------------------
      - name: Determine change type from linked PR
        id: changetype
        shell: bash
        run: |
          set -e
          echo "Detecting change type..."

          # Find merged PR that produced this commit on develop
          PR_NUMBER=$(gh pr list --base develop --state merged --json number,mergeCommit | jq -r ".[] | select(.mergeCommit.oid==\"${GITHUB_SHA}\") | .number" || true)
          CHANGE="patch"  # Default

          if [ -n "$PR_NUMBER" ]; then
            echo "Found PR #$PR_NUMBER for commit $GITHUB_SHA"
            LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' || true)
            echo "Labels: $LABELS"
            if echo "$LABELS" | grep -iq "enhancement"; then
              CHANGE="major"
            elif echo "$LABELS" | grep -iq "bug"; then
              CHANGE="minor"
            elif echo "$LABELS" | grep -iq "documentation"; then
              CHANGE="patch"
            fi
          else
            echo "No PR found for this commit. Defaulting to patch."
          fi

          echo "change=$CHANGE" >> "$GITHUB_OUTPUT"
          echo "Change type detected: $CHANGE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Determine next prerelease version (safe version)
      # ----------------------------------------------------------
      - name: Determine next prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CHANGE_TYPE=${{ steps.changetype.outputs.change || 'patch' }}

          echo "Detecting next prerelease version (change type: $CHANGE_TYPE)"

          # Get latest stable tag (may be empty)
          CURRENT_STABLE=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true | head -n 1)
          if [ -z "${CURRENT_STABLE:-}" ]; then
            CURRENT_STABLE="1.0.0"
          fi
          echo "Current stable: $CURRENT_STABLE"

          # Get latest prerelease for that stable version
          CURRENT_PRERELEASE=$(git tag --sort=-v:refname | grep -E "^${CURRENT_STABLE}-prerelease" || true | head -n 1)
          echo "Current prerelease: ${CURRENT_PRERELEASE:-none}"

          if [ -z "${CURRENT_PRERELEASE:-}" ]; then
            NEW_TAG="${CURRENT_STABLE}-prerelease"
          else
            SUFFIX=$(echo "$CURRENT_PRERELEASE" | sed -E "s/^${CURRENT_STABLE}-prerelease\.?//")

            if [ -z "$SUFFIX" ]; then
              NEW_TAG="${CURRENT_STABLE}-prerelease.0.0.1"
            else
              IFS='.' read -r a b c <<< "$SUFFIX"
              a=${a:-0}; b=${b:-0}; c=${c:-0}

              case "$CHANGE_TYPE" in
                major) a=$((a+1)); b=0; c=0 ;;
                minor) b=$((b+1)); c=0 ;;
                patch|*) c=$((c+1)) ;;
              esac

              NEW_TAG="${CURRENT_STABLE}-prerelease.${a}.${b}.${c}"
            fi
          fi

          echo "current_stable=$CURRENT_STABLE" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next prerelease version: $NEW_TAG"

      # ----------------------------------------------------------
      # Create GitHub pre-release
      # ----------------------------------------------------------
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          target_commitish: develop
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Build & Publish as prerelease (npm tag = next)
      # ----------------------------------------------------------
      - name: Build package
        run: npm run build

      - name: Set version in package.json
        shell: bash
        run: |
          TAG=${{ steps.version.outputs.new_tag }}
          echo "Setting package.json version to $TAG"
          npm version --no-git-tag-version "$TAG"

      - name: Publish to npm (with dist-tag next)
        shell: bash
        run: |
          TAG=${{ steps.version.outputs.new_tag }}
          echo "Publishing $TAG with npm dist-tag 'next'"
          npm publish --access public --tag next
