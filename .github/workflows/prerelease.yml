name: Prerelease (develop)

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  prerelease:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: read
      pull-requests: read

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install jq and gh
        run: sudo apt-get update && sudo apt-get install -y jq gh
      # --- Version Detection ---

      - name: Get stable and latest prerelease
        id: get_versions
        run: |
          set -euo pipefail

          stable=$(gh release list --limit 100 --json tagName,isPrerelease | jq -r '.[] | select(.isPrerelease==false) | .tagName' | sort -V | tail -n 1)
          
          if [ -z "$stable" ]; then
            echo "⚠️  No stable releases found — defaulting to 1.0.0"
            stable="1.0.0"
          fi
          
          stable=${stable#v}
          echo "Stable version: $stable"

          prerelease=$(gh release list --limit 100 --json tagName,isPrerelease | jq -r ".[] | select(.isPrerelease==true and .tagName | startswith(\"${stable}-prerelease.\")) | .tagName" | sort -V | tail -n 1)
          
          if [ -z "$prerelease" ]; then
            echo "⚠️  No prereleases found — defaulting to 0.0.0 and will be bumped based on PR labels"
            prerelease="0.0.0"
          fi
          
          prerelease=${prerelease#v}
          echo "Latest prerelease: $prerelease"

          echo "stable=$stable" >> $GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Determine bump type
        id: bump_type
        run: |
          labels=$(echo '${{ toJson(github.event.pull_request.labels) }}' | jq -r '.[].name')
          echo "Labels: $labels"

          bump="patch"
          if echo "$labels" | grep -q "enhancement"; then bump="major"; fi
          if echo "$labels" | grep -q "bug"; then bump="minor"; fi
          if echo "$labels" | grep -q "documenting"; then bump="patch"; fi

          echo "bump=$bump" >> $GITHUB_OUTPUT
          echo "Bump type: $bump"

      - name: Calculate new prerelease semver
        id: bump
        run: |
          stable=${{ steps.get_versions.outputs.stable }}
          prerelease=${{ steps.get_versions.outputs.prerelease }}
          bump=${{ steps.bump_type.outputs.bump }}

          inner_version=$(echo "$prerelease" | sed -n "s/^${stable}-prerelease\.//p")
          inner_version=${inner_version:-"0.0.0"}

          IFS='.' read -r pre_major pre_minor pre_patch <<<"$inner_version"

          if [ "$bump" = "major" ]; then
            pre_major=$((pre_major + 1)); pre_minor=0; pre_patch=0
          elif [ "$bump" = "minor" ]; then
            pre_minor=$((pre_minor + 1)); pre_patch=0
          else
            pre_patch=$((pre_patch + 1))
          fi

          new_inner="${pre_major}.${pre_minor}.${pre_patch}"
          new_tag="${stable}-prerelease.${new_inner}"

          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
          echo "New prerelease tag: $new_tag"
      # --- Update package.json ---
      - name: Update package.json version
        id: update_pkg
        run: |
          new_version="${{ steps.bump.outputs.new_tag }}"
          new_version="${new_version#v}"
          npm version --no-git-tag-version "$new_version"
          echo "Updated package.json version to $new_version"

