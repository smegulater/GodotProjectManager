name: Release (main)

on:
  release:
    types: [published]

jobs:
  stable:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      # ----------------------------------------------------------
      # Checkout the commit/tag from the manually created release
      # ----------------------------------------------------------
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      # ----------------------------------------------------------
      # Setup Node.js and dependencies
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      # ----------------------------------------------------------
      # Run full E2E test suite
      # ----------------------------------------------------------
      - name: Run E2E tests
        run: npm run test:e2e

      # ----------------------------------------------------------
      # Build and publish to npm (stable)
      # ----------------------------------------------------------
      - name: Build package
        run: npm run build

      - name: Set version in package.json
        shell: bash
        run: |
          TAG=${{ github.event.release.tag_name }}
          echo "Setting package.json version to $TAG"
          npm version --no-git-tag-version "$TAG"

      - name: Publish to npm (stable)
        shell: bash
        run: |
          TAG=${{ github.event.release.tag_name }}
          echo "Publishing $TAG as latest to npm"
          npm publish --access public --tag latest
